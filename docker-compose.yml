

services:
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    env_file:
      - ./blockchain/.env
    ports:
      - "8545:8545"
    networks:
      - agora-network
    volumes:
      - ./blockchain:/app/blockchain
      - /app/blockchain/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - ./client/.env
    ports:
      - "3000:3000"
    depends_on:
      - blockchain
    networks:
      - agora-network
    volumes:
      - ./client:/app/client
      - /app/client/node_modules


  frontend2:
    build:
      context: ./client2
      dockerfile: Dockerfile
    env_file:
      - ./client2/.env
    ports:
      - "3001:3000"
    depends_on:
      - blockchain
    networks:
      - agora-network
    volumes:
      - ./client2:/app/client2
      - /app/client2/node_modules

networks:
  agora-network:
    driver: bridge

